name: Architecture AFW Proof

on:
  workflow_dispatch:
    inputs:
      start_state:
        description: AFW start state
        required: true
        default: intent
        type: choice
        options:
          - intent
          - rq
          - task
          - investigation
          - experiment
          - evidence
          - reflection
          - next_rq
  push:
    paths:
      - 'runtime/**'
      - '.github/workflows/afw.yml'

jobs:
  afw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run AFW tests
        run: python -m pytest -q runtime/test_afw.py
      - name: Run architecture AFW demo
        env:
          START_STATE: ${{ inputs.start_state }}
        run: |
          python runtime/afw.py "${START_STATE:-intent}" | tee afw-run.json
      - name: Record evidence
        run: |
          mkdir -p evidence/afw
          cp afw-run.json evidence/afw/run.json
          printf '%s\n' \
            'Architecture AFW proof' \
            "sha=${GITHUB_SHA}" \
            "run_id=${GITHUB_RUN_ID}" \
            "start_state=${START_STATE:-intent}" \
            > evidence/afw/metadata.md
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: architecture-afw-evidence-${{ github.run_id }}
          path: evidence/afw/
