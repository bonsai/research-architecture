ontology:
  id: architecture-research
  version: "0.2.0"
  label: Architecture Research Ontology
  scope: RQ-* / EXT-* (EXP-* retained as legacy)

prefixes:
  RQ:
    meaning: Research Question
    role: Research intent, hypothesis, antithesis, and acceptance.
  EXT:
    meaning: Extension
    role: Reusable implementation or experimental extension of an RQ.

classes:
  ResearchQuestion:
    description: Research question defining what and why to investigate.
  Extension:
    description: Reusable extension that operationalizes a ResearchQuestion.
  ArchitectureWork:
    description: Architectural work or research target.
  Representation:
    description: CAD, BIM, mesh, image, animation, or other representation.
  ArchitecturalObject:
    description: Spatial or constructive object such as room, wall, opening, or structure.
  Geometry:
    description: Geometric and topological representation.
  Feature:
    description: Measured or computed property.
  SemanticConcept:
    description: Meaning, function, classification, or conceptual interpretation.
  SpatialRelation:
    description: Relation between architectural objects.
  TemporalState:
    description: State at a time or frame.
  Experience:
    description: Human observation or spatial experience.
  Material:
    description: Physical material and properties.
  Fabrication:
    description: Process becoming a physical artifact.
  Parameter:
    description: Variable controlling geometry, material, experience, or generation.
  Rule:
    description: Constraint or generative rule.
  ArchitectureGrammar:
    description: Reusable composition of architectural rules and relations.
  Experiment:
    description: Reproducible research experiment.
  Observation:
    description: Recorded observation.
  Evidence:
    description: Measurement or traceable support.
  Prediction:
    description: Model-derived prediction.
  Transformation:
    description: Structural transformation from one artifact/system into another.
  Provenance:
    description: Source, transformation, generation, and reproducibility metadata.

relations:
  hasExtension:
    domain: ResearchQuestion
    range: Extension
  extends:
    domain: Extension
    range: ResearchQuestion
  hasHypothesis:
    domain: ResearchQuestion
    range: SemanticConcept
  hasAntithesis:
    domain: ResearchQuestion
    range: SemanticConcept
  hasAcceptance:
    domain: ResearchQuestion
    range: Evidence
  hasRepresentation:
    domain: ArchitectureWork
    range: Representation
  represents:
    domain: Representation
    range: ArchitecturalObject
  hasGeometry:
    domain: ArchitecturalObject
    range: Geometry
  hasFeature:
    domain: [ArchitecturalObject, Geometry]
    range: Feature
  hasSemantic:
    domain: [ArchitectureWork, ArchitecturalObject]
    range: SemanticConcept
  participatesIn:
    domain: ArchitecturalObject
    range: SpatialRelation
  hasTemporalState:
    domain: ArchitectureWork
    range: TemporalState
  hasExperience:
    domain: ArchitectureWork
    range: Experience
  hasMaterial:
    domain: [ArchitecturalObject, Geometry]
    range: Material
  hasFabrication:
    domain: Material
    range: Fabrication
  hasParameter:
    domain: [ArchitectureWork, ArchitecturalObject, Rule, ArchitectureGrammar, Extension]
    range: Parameter
  hasRule:
    domain: [Experiment, ArchitectureGrammar, Extension]
    range: Rule
  hasGrammar:
    domain: ArchitectureWork
    range: ArchitectureGrammar
  constrainedBy:
    domain: [ArchitectureGrammar, Rule, ArchitecturalObject]
    range: Rule
  observedBy:
    domain: [ArchitectureWork, ResearchQuestion, Extension, Experience]
    range: Observation
  supportedBy:
    domain: Observation
    range: Evidence
  predictedBy:
    domain: [ArchitectureWork, Prediction]
    range: Prediction
  transformedFrom:
    domain: Transformation
    range: ArchitectureWork
  transformedInto:
    domain: Transformation
    range: ArchitectureWork
  hasTransformation:
    domain: ArchitectureWork
    range: Transformation
  hasProvenance:
    domain: [ArchitectureWork, Representation, Experiment, Extension, Transformation]
    range: Provenance
  producedBy:
    domain: [Geometry, Representation, Prediction]
    range: [Experiment, Fabrication]

skeleton:
  RQ:
    children: [hypothesis, antithesis, evidence, acceptance, EXT]
  EXT:
    parent: RQ
    children: [concept, data, rule, geometry, implementation, evaluation, provenance]

legacy_mapping:
  EXP-001: RQ-001
  EXP-002: RQ-002
  EXP-003: RQ-003
  EXP-005: RQ-004
  EXP-006: RQ-005
  EXP-007: RQ-006
  EXP-008: RQ-007

invariants:
  - Object is not Representation.
  - Geometry is not Meaning.
  - Visualization is not Evidence.
  - Rule is not Geometry.
  - Prediction is not Fact.
  - Copy is not Transformation.
  - RQ defines intent; EXT operationalizes it.
  - Every EXT has exactly one primary RQ.

pipeline:
  - RQ
  - EXT
  - Observe
  - Represent
  - Normalize
  - Measure
  - Semanticize
  - Store
  - Compare
  - Predict
  - Generate
  - Fabricate
  - Experience
  - Observe
