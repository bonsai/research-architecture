skeleton:
  version: "0.2.0"
  purpose: Minimal research planning skeleton for architecture research.

prefixes:
  RQ:
    meaning: Research Question
    ja: 研究問い
    role: What is being asked
  EXT:
    meaning: Extension
    ja: 概念の拡張・展開
    role: How the question is developed conceptually
  EXP:
    meaning: Experiment
    ja: 実験・実装
    role: How an extension is tested
  RX:
    meaning: Research eXperience
    ja: 観察・経験
    role: What is observed and learned

flow: RQ -> EXT -> EXP -> RX -> Evidence -> ThesisRevision

structure:
  RQ:
    required:
      - question
      - hypothesis
      - antithesis
      - acceptance
    next: EXT
  EXT:
    required:
      - parent_rq
      - concept
      - purpose
      - input
      - transformation
      - output
      - evaluation
      - provenance
    next: EXP
  EXP:
    phase: 1
    required:
      - parent_ext
      - method
      - data
      - result
    next: RX
  RX:
    required:
      - source
      - observation
      - interpretation
      - next_question

rules:
  - One RQ has exactly one primary EXT.
  - One EXT may have zero or more EXP.
  - One EXP may produce zero or more RX.
  - Phase 0 creates and refines RQ, EXT, Ontology, and dependencies only.
  - Phase 0 does not create executable code or run experiments.
  - EXP is the first layer where code and experimental execution are allowed.
  - Visualization is an artifact unless an observation procedure and provenance make it evidence.
  - Prediction is not fact; transformation is not copying.

repository:
  questions: RQ-###.md
  extensions: EXT-###.md or EXT-###/
  experiments: EXP-###/
  rx: RX-###.md
  ontology: ontology/

legacy:
  - Existing EXP identifiers remain historical references.
  - Detailed implementation issues are Phase 1 backlog, not Phase 0 work.
